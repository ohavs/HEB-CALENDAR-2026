<!doctype html>
<html lang="he" dir="rtl" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>לוח שנה עברי</title>
    <meta name="description" content="לוח שנה עברי נקי עם כל החגים והמועדים, זמני כניסת ויציאת שבת, תזכורות ואירועים אישיים." />

    <!-- PWA -->
    <meta name="theme-color" content="#F6F6FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="לוח עברי" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/icon.svg" color="#6366F1" />

    <!-- פונט עברי נקי -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // מחילים ערכת נושא לפני הצביעה הראשונה, כדי שלא יהיה הבהוב לבן במצב לילה
      (function () {
        try {
          var saved = localStorage.getItem('heb-cal:theme');
          var mode = saved ? JSON.parse(saved) : 'system';
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
