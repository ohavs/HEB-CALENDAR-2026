# בניית אפליקציית האנדרואיד בענן.
#
# הבנייה רצה על ראנר של אובונטו, שכבר כולל את ה-Android SDK, ולכן אין
# צורך במחשב עם Android Studio. התוצאה היא קובץ APK שאפשר להוריד ולהתקין
# ישירות בטלפון, מהדף:
#
#   https://github.com/ohavs/HEB-CALENDAR-2026/releases/tag/android-latest
#
# סודות (Settings → Secrets and variables → Actions):
#
#   ANDROID_KEYSTORE_BASE64      מפתח החתימה, מקודד base64. בלעדיו הבנייה
#                                עדיין מצליחה אבל נחתמת במפתח דיבאג, ואז
#                                אי אפשר לעדכן התקנה קיימת.
#   ANDROID_KEYSTORE_PASSWORD    הסיסמה של אותו מפתח
#   VITE_GOOGLE_WEB_CLIENT_ID    מזהה הלקוח של גוגל (web). בלעדיו האפליקציה
#                                עובדת מקומית, בלי התחברות וסנכרון.
#   GOOGLE_SERVICES_JSON         תוכן google-services.json מקונסולת Firebase.
#                                בלעדיו הבנייה עוברת, אבל בלי התראות push
#                                על הזמנה לרשימה משותפת.
#
# כל ריצה מפרסמת שני תוצרים: APK להתקנה, וחבילת web לעדכון חי. האפליקציה
# בוחרת ביניהם לפי טביעת הקוד הנייטיבי - ראו src/lib/appUpdate.ts.
#
# שאר משתני VITE_FIREBASE_* משותפים עם פריסת האתר.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/stoic-ride-7cl69q
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ההיסטוריה המלאה נדרשת כדי לדעת מתי השתנה לאחרונה הקוד הנייטיבי
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # אותו שער כמו בפריסת האתר: מה שנשבר לא נארז לאפליקציה
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # טביעת הקוד הנייטיבי: הקומיט האחרון שנגע במעטפת. חבילת web שנושאת
      # את אותה טביעה יכולה להתחלף בעדכון חי; טביעה אחרת פירושה שצריך
      # להתקין APK. ראו src/lib/appUpdate.ts.
      - name: Compute the native revision
        id: native
        run: |
          rev=$(git log -1 --format=%h -- android package-lock.json capacitor.config.ts)
          if [ -z "$rev" ]; then
            echo "::error title=No native revision::could not resolve the last native commit"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "Native revision: $rev"

      # PREVIEW_BUILD=1: בלי service worker. בתוך WebView הוא רק היה מחזיק
      # גרסה ישנה במטמון, וההתראות ממילא עוברות למערכת ההפעלה.
      - name: Build web bundle
        env:
          PREVIEW_BUILD: '1'
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_NATIVE_REV: ${{ steps.native.outputs.rev }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: heb-calendar-2026
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # FCM מזהה את האפליקציה לפי הקובץ הזה, ובלעדיו התראות push לא
      # עובדות - הבנייה עדיין מצליחה, כי build.gradle מחיל את התוסף רק
      # כשהקובץ קיים. הוא אינו סוד (מזהים ציבוריים, כמו קונפיג ה-web),
      # אבל הוא נשמר כסוד כדי שלא ייכנס למאגר.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning title=No google-services.json::GOOGLE_SERVICES_JSON is not set - push notifications will not work"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          # הקובץ מגיע מסוד, ולכן איש אינו רואה אותו. קובץ של פרויקט או
          # חבילה אחרים נבלע בשקט: הבנייה עוברת, האפליקציה עולה, ורק
          # ההתראות לא מגיעות - ואין שום רמז למה. עדיף להיכשל כאן.
          if ! grep -q '"project_id"[[:space:]]*:[[:space:]]*"heb-calendar-2026"' android/app/google-services.json; then
            echo "::error title=Wrong google-services.json::הקובץ אינו של הפרויקט heb-calendar-2026"
            exit 1
          fi
          if ! grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.ohav.hebcal"' android/app/google-services.json; then
            echo "::error title=Wrong package in google-services.json::הקובץ אינו מכיל את החבילה com.ohav.hebcal - יש להוסיף אפליקציית אנדרואיד בקונסולה"
            exit 1
          fi
          echo "google-services.json תקין - התראות push יעבדו בגרסה הזו"
          echo "התראות push: מוגדרות ✅" >> "$GITHUB_STEP_SUMMARY"

      # הקובץ נכתב מחוץ לעץ העבודה, כדי שלא ייארז בטעות ולא ייכנס ל-git
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No signing key::ANDROID_KEYSTORE_BASE64 is not set - building with the debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hebcal.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEY_ALIAS: hebcal
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/hebcal.jks"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect the APK and the web bundle
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release*.apk \
             "out/heb-calendar-1.0.${{ github.run_number }}.apk"
          # אותו dist בדיוק שנארז לתוך ה-APK, לעדכון חי
          (cd dist && zip -rq "../out/bundle-${{ github.run_number }}-${{ steps.native.outputs.rev }}.zip" .)
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: heb-calendar-apk
          path: out/*
          retention-days: 30

      # קישור הורדה יציב, שאפשר לפתוח מהטלפון בלי לחפש בין ריצות.
      #
      # שם קובץ ה-APK הוא גם החוזה מול בדיקת העדכון באפליקציה: היא קוראת
      # את השחרור הזה דרך ה-API וגוזרת את מספר הגרסה מהמספר האחרון בשם.
      # ראו src/lib/appUpdate.ts.
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=android-latest
          subject=$(git log -1 --pretty=%s)
          notes=$(printf '%s\n\nגרסה 1.0.%s · נבנתה מ-%s' \
            "$subject" "${{ github.run_number }}" "${GITHUB_SHA::7}")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create "$tag" --title "אפליקציית אנדרואיד" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" out/* --clobber

          # מסירים קבצים של בניות קודמות: השחרור הזה מתאר גרסה אחת, וזו
          # גם ההנחה של בדיקת העדכון באפליקציה
          keep=$(cd out && ls)
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | { grep -E '^(heb-calendar-.*\.apk|bundle-.*\.zip)$' || true; } \
            | while read -r old; do
                [ -n "$old" ] || continue
                printf '%s\n' "$keep" | grep -qx "$old" && continue
                gh release delete-asset "$tag" "$old" -y
              done

      - name: Summary
        run: |
          {
            echo "### האפליקציה נבנתה 📱"
            echo ""
            echo "**הורדה:** https://github.com/${GITHUB_REPOSITORY}/releases/tag/android-latest"
            echo ""
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "נחתמה במפתח הקבוע."
            else
              echo "⚠️ נחתמה במפתח דיבאג - התקנה על גרסה קודמת תיכשל. הוסיפו את הסוד \`ANDROID_KEYSTORE_BASE64\`."
            fi
            if [ -z "${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}" ]; then
              echo ""
              echo "⚠️ אין \`VITE_GOOGLE_WEB_CLIENT_ID\` - ההתחברות לגוגל מושבתת בגרסה הזו."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
