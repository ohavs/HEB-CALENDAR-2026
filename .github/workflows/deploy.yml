# פריסה אוטומטית ל-Firebase Hosting.
#
# מה צריך להגדיר פעם אחת ב-GitHub, תחת
# Settings → Secrets and variables → Actions → New repository secret:
#
#   FIREBASE_TOKEN                     חובה. הפלט של `firebase login:ci`
#   VITE_FIREBASE_API_KEY              חובה. מ-Firebase Console → Project settings → Your apps
#   VITE_FIREBASE_AUTH_DOMAIN          חובה
#   VITE_FIREBASE_STORAGE_BUCKET       חובה
#   VITE_FIREBASE_MESSAGING_SENDER_ID  חובה
#   VITE_FIREBASE_APP_ID               חובה
#   VITE_FIREBASE_MEASUREMENT_ID       אופציונלי (אנליטיקס)
#
# מזהה הפרויקט אינו סוד - הוא מוטמע בחבילה שנשלחת לכל דפדפן - ולכן הוא
# מוגדר כאן ובקובץ .firebaserc, ולא כסוד.
#
# אם אחד הסודות החובה חסר, השלב הראשון ייכשל עם רשימה מדויקת של מה שחסר,
# במקום להיכשל באמצע הפריסה.
#
# הבדיקות והלינטר רצים לפני הבנייה: מה שנשבר לא מגיע לאוויר.

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/stoic-ride-7cl69q
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: heb-calendar-2026

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # בדיקה מקדימה: מוודאת שכל הסודות הנדרשים קיימים.
      # הבדיקה בוחנת רק אם הערך ריק ואינה מדפיסה אף ערך.
      - name: Check required secrets
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=""
          for name in FIREBASE_TOKEN \
                      VITE_FIREBASE_API_KEY \
                      VITE_FIREBASE_AUTH_DOMAIN \
                      VITE_FIREBASE_STORAGE_BUCKET \
                      VITE_FIREBASE_MESSAGING_SENDER_ID \
                      VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing  - $name"$'\n'
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these under Settings -> Secrets and variables -> Actions"
            printf 'The following repository secrets are not set:\n%s\n' "$missing"
            exit 1
          fi
          echo "All required secrets are present."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # שער לפני הפריסה: בדיקה שנשברה לא אמורה להגיע לאוויר.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck and build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Deploy hosting and Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: >-
          npx --yes firebase-tools@13 deploy
          --only hosting,firestore:rules
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive

      # שלב נפרד ואחרי האתר, בכוונה: פריסת פונקציות דורשת את תוכנית
      # Blaze, וכשל שלה לא אמור למנוע מהאתר ומהכללים לעלות. היא נכשלת
      # ברעש ולא בשקט - פונקציה שלא נפרסה פירושה שאיש לא יקבל התראה על
      # הזמנה.
      # האזור נקרא מהמסד ולא נכתב ביד.
      #
      # הוא חייב להתאים למיקום מסד הנתונים (טריגר Firestore עובר דרך
      # Eventarc), ושתי פריסות נשרפו על ניחוש שגוי שלו. מקור האמת היחיד
      # הוא המסד עצמו, אז שואלים אותו. vars.FUNCTION_REGION גובר, אם אי
      # פעם יידרש משהו אחר.
      - name: Resolve the function region from the database location
        id: region
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          OVERRIDE: ${{ vars.FUNCTION_REGION }}
        run: |
          set -u
          if [ -n "$OVERRIDE" ]; then
            echo "region=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "אזור מתוך vars: $OVERRIDE"
            exit 0
          fi
          raw=$(npx --yes firebase-tools@13 firestore:databases:get "(default)" --project "$FIREBASE_PROJECT_ID" --json 2>/dev/null || true)
          loc=$(printf '%s' "$raw" | grep -o '"locationId"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          case "$loc" in
            eur3) region=europe-west1 ;;
            nam5|nam7) region=us-central1 ;;
            "") echo "::warning title=Unknown database location::לא הצלחנו לקרוא את מיקום המסד; נופלים ל-europe-west1"; region=europe-west1 ;;
            *) region="$loc" ;;
          esac
          echo "מיקום המסד: ${loc:-לא ידוע} → אזור הפונקציה: $region"
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "מיקום המסד \`${loc:-?}\` ← הפונקציה ב-\`$region\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the invite notification function
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FUNCTION_REGION: ${{ steps.region.outputs.region }}
        # --force: החלפת אזור משאירה את הפונקציה הישנה יתומה בפרויקט,
        # וה-CLI מסרב למחוק אותה במצב לא-אינטראקטיבי ונעצר. יש כאן
        # פונקציה אחת בלבד, ולכן "מה שאינו בקוד - יימחק" הוא בדיוק
        # ההתנהגות הרצויה.
        run: >-
          npx --yes firebase-tools@13 deploy
          --only functions
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive
          --force

      - name: Show the deployed URL
        run: |
          echo "### האפליקציה פורסמה 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$FIREBASE_PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
