# פריסה אוטומטית ל-Firebase Hosting.
#
# מה צריך להגדיר פעם אחת ב-GitHub, תחת
# Settings → Secrets and variables → Actions → Secrets:
#
#   FIREBASE_TOKEN                     הפלט של `firebase login:ci`
#   VITE_FIREBASE_API_KEY              מ-Firebase Console → Project settings → Your apps
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID       אופציונלי
#
# אף אחד מהערכים האלה לא נשמר בריפו. הם מוזרקים כאן בזמן ה-build בלבד.

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/stoic-ride-7cl69q
  workflow_dispatch:

# מריצים פריסה אחת בכל פעם, ומבטלים ריצה קודמת שעוד לא הסתיימה
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Deploy hosting and Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: >-
          npx --yes firebase-tools@13 deploy
          --only hosting,firestore:rules
          --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
          --non-interactive
